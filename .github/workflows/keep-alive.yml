name: Keep Streamlit Apps Alive

on:
  schedule:
    - cron: '0 */1 * * *'  # every hour
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Visit all Streamlit apps with headless browser
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');

          const urls = [
            "https://perceptrons-to-transformers-23pcqtappwdfpdoywndoewt.streamlit.app/",
            "https://rnilav-perceptro-02-multi-layer-perceptronmlp-playground-f24pnx.streamlit.app/",
            "https://rnilav-perceptrons-03-backpropagationbackprop-playground-tlr5ql.streamlit.app/",
            "https://rnilav-perceptron-04-optimizationoptimization-playground-anxskw.streamlit.app/",
            "https://rnilav-percep-05-regularizationregularization-playground-z72npw.streamlit.app/",
            "https://rnilav-perceptrons-to-transformers-06-cnncnn-playground-7vlhgb.streamlit.app/",
            "https://rnilav-perceptrons-to-transformers-08-rnnrnn-playground-cj8yxy.streamlit.app/",
            "https://rnilav-perceptrons-to-t-09-attentionattention-playground-7cap4z.streamlit.app/",
            "https://rnilav-perceptrons-to-tran-agent-seriesmemory-playground-adlolh.streamlit.app/"
          ];

          (async () => {
            const browser = await chromium.launch();

            for (const url of urls) {
              console.log(`\nVisiting: ${url}`);
              const page = await browser.newPage();
              try {
                await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
                // Wait a few seconds so Streamlit registers the WebSocket session
                await page.waitForTimeout(5000);
                const title = await page.title();
                console.log(`  ✓ Loaded — title: "${title}"`);
              } catch (err) {
                console.log(`  ✗ Failed — ${err.message}`);
              } finally {
                await page.close();
              }
            }

            await browser.close();
            console.log('\nDone.');
          })();
          EOF